server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Хэшированные ассеты (app.<hash>.js, app.<hash>.css) неизменны по содержимому —
    # их можно кешировать браузером на год без риска отдать устаревшую версию:
    # при следующем деплое у файла будет уже другое имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Приложение — это SPA с клиентским роутером (react-router-dom, HashRouter), поэтому
    # любой путь, которого нет среди реальных файлов, должен отдавать index.html, а не
    # 404 — иначе обновление страницы на "/#/goals" (или прямой переход по ссылке)
    # сломается.
    location / {
        try_files $uri /index.html;
    }
}
