# Сборка и выпуск приложения для Android.
# Запускается сама при каждом обновлении папки mobile и вручную: вкладка Actions → «Сборка Android» → Run workflow.
# Результат: релиз на странице Releases с файлом navigator.apk. Приложение на телефоне само находит новый релиз
# (Настройки → «Версия и обновление») и ставит его поверх старой версии, данные сохраняются.
# Нужен один раз добавленный секрет NAVIGATOR_KEYSTORE_BASE64 (постоянный ключ подписи), см. mobile/UPDATES.md.
name: Сборка Android
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", "backend/src/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NAV_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Номер сборки
        run: |
          # Минуты с 1970 года: всегда растёт, годится как versionCode Android и как номер релиза.
          echo "NAV_BUILD=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "NAV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.NAVIGATOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Не задан секрет NAVIGATOR_KEYSTORE_BASE64. Без постоянного ключа Android не сможет обновить приложение поверх старого, и придётся удалять его вместе с данными. Добавь секрет: Settings → Secrets and variables → Actions → New repository secret (инструкция в mobile/UPDATES.md)."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE" | base64 -d > signing/navigator.jks
          keytool -list -keystore signing/navigator.jks -storepass navigator-release > /dev/null

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npm run android-prepare
      - run: npx cap sync android
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Проверка подписи и версии файла
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | sed -n "1,3p"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|application-label:" | sed -n "1,2p"
          cp "$APK" navigator.apk

      - name: Описание версии
        run: |
          # Берём первый раздел из CHANGELOG.md
          awk '/^## /{n++} n==1{print}' CHANGELOG.md | tail -n +2 > release-notes.md || true
          [ -s release-notes.md ] || echo "Обновление приложения." > release-notes.md

      - name: Выпуск
        run: |
          gh release create "b${NAV_BUILD}" navigator.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Версия ${NAV_VERSION}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: navigator-apk
          path: mobile/navigator.apk
